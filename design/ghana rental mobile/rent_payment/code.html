<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rent Payment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006b3e",
                        "background-light": "#f5f8f7",
                        "background-dark": "#0f231b",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .momo-radio:checked + div {
            border-color: #FFCC00; /* MTN Gold Border requested */
            background-color: rgba(255, 204, 0, 0.05);
        }
        .voda-radio:checked + div {
            border-color: #E60000;
            background-color: rgba(230, 0, 0, 0.05);
        }
        .airtel-radio:checked + div {
            border-color: #00AEEF;
            background-color: rgba(0, 174, 239, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-[#0c1d16] dark:text-white">
<!-- Top Navigation Bar -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-primary/10">
<div class="text-[#0c1d16] dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Make Payment</h2>
</div>
<main class="max-w-md mx-auto pb-32">
<!-- Payment Summary Card -->
<div class="p-4 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl shadow-sm bg-white dark:bg-zinc-900 border border-primary/10 overflow-hidden">
<div class="w-full bg-center bg-no-repeat aspect-[21/9] bg-cover" data-alt="Modern residential building in Accra Ghana" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCZRLIdMWLmX_YGQojZve7wNSA7nBvQk3dzfacLcFaif8tuHJqdmMW57o4NZGSISxT_R3MNcNMoRb8kQVhw8dK5ujqQq_LcYjk5Yizpqw__QXceEQ7sYBdH0u4Uwa7XoUA-VNE2KhNnjhmhqvCflxvfDIjjZA8vPfFr7sAMD9oJ3zWNrnzzzohul3vNZ9e2EaxWpQxiNBFu49xKnjZf6ze5KRgyRibJuxUPC94uurxmz313fsYP1xu8Zwujk7w_NeXYyJ_cM0k-mz0i");'>
</div>
<div class="flex w-full flex-col gap-1 p-5">
<div class="flex justify-between items-start">
<div>
<p class="text-primary font-bold text-xs uppercase tracking-wider">Rent Summary</p>
<p class="text-2xl font-bold mt-1">GHS 2,700.00</p>
</div>
<div class="bg-primary/10 text-primary px-3 py-1 rounded-full text-xs font-bold">
                            FEB 2025
                        </div>
</div>
<div class="mt-4 space-y-2 border-t border-dashed border-gray-200 dark:border-zinc-700 pt-4">
<div class="flex justify-between text-sm">
<span class="text-gray-500 dark:text-zinc-400">Monthly Rent</span>
<span class="font-medium">GHS 2,500.00</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-gray-500 dark:text-zinc-400">Income Tax (8%)</span>
<span class="font-medium">GHS 200.00</span>
</div>
<div class="flex justify-between text-sm pt-2 border-t border-gray-100 dark:border-zinc-800">
<span class="text-primary font-semibold">Net to Landlord</span>
<span class="text-primary font-bold">GHS 2,500.00</span>
</div>
</div>
</div>
</div>
</div>
<!-- Section Header -->
<h3 class="text-lg font-bold leading-tight tracking-tight px-4 pb-2 pt-4">Select Payment Method</h3>
<!-- Payment Methods List -->
<div class="flex flex-col gap-3 p-4">
<!-- MTN MoMo -->
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only momo-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-xl border-2 border-transparent bg-white dark:bg-zinc-900 p-4 shadow-sm transition-all peer-checked:border-[#FFCC00] ring-1 ring-gray-200 dark:ring-zinc-800">
<div class="size-12 rounded-lg bg-[#FFCC00] flex items-center justify-center shrink-0">
<span class="text-black font-black text-xs">MTN</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-bold">MTN Mobile Money</p>
<p class="text-gray-500 dark:text-zinc-400 text-xs">Fast &amp; Reliable</p>
</div>
<div class="text-primary peer-checked:block">
<span class="material-symbols-outlined text-[#FFCC00]">check_circle</span>
</div>
</div>
</label>
<!-- Vodafone Cash -->
<label class="relative cursor-pointer">
<input class="peer sr-only voda-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-xl border-2 border-transparent bg-white dark:bg-zinc-900 p-4 shadow-sm transition-all peer-checked:border-[#E60000] ring-1 ring-gray-200 dark:ring-zinc-800">
<div class="size-12 rounded-lg bg-[#E60000] flex items-center justify-center shrink-0 text-white">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-bold">Vodafone Cash</p>
<p class="text-gray-500 dark:text-zinc-400 text-xs">Instant transfer</p>
</div>
</div>
</label>
<!-- AirtelTigo -->
<label class="relative cursor-pointer">
<input class="peer sr-only airtel-radio" name="payment_method" type="radio"/>
<div class="flex items-center gap-4 rounded-xl border-2 border-transparent bg-white dark:bg-zinc-900 p-4 shadow-sm transition-all peer-checked:border-[#00AEEF] ring-1 ring-gray-200 dark:ring-zinc-800">
<div class="size-12 rounded-lg bg-[#00AEEF] flex items-center justify-center shrink-0 text-white">
<span class="material-symbols-outlined">payments</span>
</div>
<div class="flex grow flex-col">
<p class="text-sm font-bold">AirtelTigo Money</p>
<p class="text-gray-500 dark:text-zinc-400 text-xs">Standard processing</p>
</div>
</div>
</label>
</div>
<!-- Phone Number Input -->
<div class="flex flex-wrap items-end gap-4 px-4 py-3">
<label class="flex flex-col w-full">
<p class="text-sm font-bold leading-normal pb-2 px-1">MoMo Phone Number</p>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-medium">+233</span>
<input class="form-input flex w-full rounded-xl text-[#0c1d16] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-primary/20 bg-white dark:bg-zinc-900 focus:border-primary h-14 pl-16 pr-4 placeholder:text-gray-400 text-base font-medium" placeholder="024 123 4567" type="tel" value="024 456 7890"/>
</div>
</label>
</div>
<div class="px-4 py-2 flex items-center gap-2 text-xs text-gray-500 dark:text-zinc-400">
<span class="material-symbols-outlined text-sm">verified_user</span>
            Secured by Bank of Ghana compliant payment gateway
        </div>
</main>
<!-- Fixed Bottom Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-primary/10">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
<span>Pay GHS 2,700.00</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<p class="text-center text-[10px] text-gray-400 mt-2 uppercase tracking-widest font-bold">Secure Rental Transaction</p>
</div>
</div>
</body></html>
