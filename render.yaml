# Render Blueprint for Ghana Rental System
# Deploy with: render blueprint apply

services:
  # Backend API
  - type: web
    name: ghana-rental-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: cd backend && npm install && npm run migrate && npm run seed
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ghana-rental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATION_MODE
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: AWS_S3_BUCKET
        value: ghana-rental-uploads

  # Web Dashboard (for GRA/Inspector/Admin)
  - type: web
    name: ghana-rental-dashboard
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ghana-rental-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ghana-rental-db
    databaseName: ghana_rental
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: 15
